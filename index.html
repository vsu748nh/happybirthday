    // --- WEB AUDIO SYNTHESIZER ---
    class AudioSynthEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.timer = null;
      }

      initCtx() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playNote(freq, duration, type = 'sine', gainVal = 0.15) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }

      playTypewriterClick() {
        this.initCtx();
        this.playNote(800 + Math.random() * 200, 0.04, 'triangle', 0.04);
      }

      playMagicSparkle() {
        this.initCtx();
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.playNote(freq, 0.3, 'sine', 0.1);
          }, idx * 60);
        });
      }

      playBlowOutSound() {
        this.initCtx();
        const notes = [400, 300, 200, 150];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.playNote(freq, 0.2, 'sine', 0.08);
          }, idx * 50);
        });
      }

      startMelody(presetName) {
        this.stop();
        this.initCtx();
        this.isPlaying = true;

        const melodies = {
          'synth-romantic-waltz': [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 329.63, 293.66],
          'synth-starlight-lullaby': [392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 523.25],
          'synth-princess-theme': [523.25, 659.25, 783.99, 880.00, 783.99, 659.25, 523.25]
        };

        const notes = melodies[presetName] || melodies['synth-romantic-waltz'];
        let step = 0;

        this.timer = setInterval(() => {
          if (!this.isPlaying) return;
          const note = notes[step % notes.length];
          this.playNote(note, 0.8, 'sine', 0.12);
          this.playNote(note * 0.5, 1.2, 'triangle', 0.05);
          step++;
        }, 600);
      }

      stop() {
        this.isPlaying = false;
        if (this.timer) {
          clearInterval(this.timer);
          this.timer = null;
        }
      }
    }

    const audioSynth = new AudioSynthEngine();

    // --- CANVAS PARTICLES OVERLAY ---
    function ParticleCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = Array.from({ length: 45 }).map(() => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2.5 + 0.5,
          color: Math.random() > 0.4 ? '#FF80AB' : '#FFD700',
          vy: -(Math.random() * 0.5 + 0.2),
          vx: (Math.random() - 0.5) * 0.4,
          alpha: Math.random() * 0.8 + 0.2,
          pulse: Math.random() * 0.02 + 0.005
        }));

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          particles.forEach(p => {
            p.y += p.vy;
            p.x += p.vx;
            p.alpha += Math.sin(Date.now() * p.pulse) * 0.01;

            if (p.y < -10) {
              p.y = canvas.height + 10;
              p.x = Math.random() * canvas.width;
            }

            ctx.save();
            ctx.globalAlpha = Math.max(0.1, Math.min(1, p.alpha));
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', resizeCanvas);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 w-full h-full" />;
    }

    // Helper function to resolve Dropbox or direct MP3 URLs
    function getDirectAudioUrl(url) {
      if (!url) return '';
      if (url.startsWith('synth-')) return url;
      if (url.includes('dropbox.com')) {
        let direct = url.replace('dl=0', 'raw=1').replace('dl=1', 'raw=1');
        direct = direct.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
        return direct;
      }
      return url;
    }

    // Helper function to resolve Google Drive & Dropbox image URLs into direct web-viewable links
    function getDirectImageUrl(url) {
      if (!url || typeof url !== 'string') return '';
      let trimmed = url.trim();

      // Convert Google Drive share / view links to direct web display link
      // e.g. https://drive.google.com/file/d/1Db-6Ro0gvixeo7f3PHkJmto0wEBwUw-j/view?usp=drive_link
      // -> https://lh3.googleusercontent.com/d/1Db-6Ro0gvixeo7f3PHkJmto0wEBwUw-j
      if (trimmed.includes('drive.google.com') || trimmed.includes('lh3.googleusercontent.com')) {
        const fileIdMatch = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || 
                            trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/) ||
                            trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (fileIdMatch && fileIdMatch[1]) {
          return `https://lh3.googleusercontent.com/d/${fileIdMatch[1]}`;
        }
      }

      // Convert Dropbox image links to direct content view
      if (trimmed.includes('dropbox.com')) {
        let direct = trimmed.replace('dl=0', 'raw=1').replace('dl=1', 'raw=1');
        direct = direct.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
        return direct;
      }

      return trimmed;
    }

    // --- SCENE 5: MUSIC PLAYER (Playful Castle Variation - Soft Pastel Pink Theme) ---
    function MusicPlayer({ onNext, config }) {
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTrackIdx, setCurrentTrackIdx] = useState(0);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [audioError, setAudioError] = useState(false);

      const audioRef = useRef(null);
      const track = config.playlist[currentTrackIdx] || config.playlist[0];
      const isHttpAudio = track && track.audioUrl && (track.audioUrl.startsWith('http://') || track.audioUrl.startsWith('https://'));

      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.pause();
        }
        audioSynth.stop();
        setIsPlaying(false);
        setAudioError(false);
        setCurrentTime(0);
        setDuration(0);
      }, [currentTrackIdx]);

      const playTrack = () => {
        setAudioError(false);
        if (isHttpAudio) {
          const streamUrl = getDirectAudioUrl(track.audioUrl);
          if (audioRef.current) {
            audioRef.current.src = streamUrl;
            audioRef.current.play().then(() => {
              setIsPlaying(true);
            }).catch(err => {
              console.warn("Direct audio playback failed, falling back to synth:", err);
              setAudioError(true);
              audioSynth.startMelody('synth-romantic-waltz');
              setIsPlaying(true);
            });
          }
        } else {
          audioSynth.startMelody(track.audioUrl || 'synth-romantic-waltz');
          setIsPlaying(true);
        }
      };

      const stopTrack = () => {
        if (audioRef.current) {
          audioRef.current.pause();
        }
        audioSynth.stop();
        setIsPlaying(false);
      };

      const togglePlay = () => {
        if (isPlaying) {
          stopTrack();
        } else {
          playTrack();
        }
      };

      const handleNextTrack = () => {
        const nextIdx = (currentTrackIdx + 1) % config.playlist.length;
        setCurrentTrackIdx(nextIdx);
      };

      const formatTime = (seconds) => {
        if (!seconds || isNaN(seconds)) return '00:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      return (
        <div className="flex flex-col items-center justify-center min-h-screen px-4 pt-20 bg-[#fdf2f8] text-[#32302c] relative overflow-hidden">
          <div className="dot-grid"></div>

          <audio
            ref={audioRef}
            onTimeUpdate={() => {
              if (audioRef.current) {
                setCurrentTime(audioRef.current.currentTime);
                setDuration(audioRef.current.duration || 0);
              }
            }}
            onEnded={() => {
              setIsPlaying(false);
              handleNextTrack();
            }}
            onError={() => {
              setAudioError(true);
            }}
          />

          <div className="w-full max-w-md bg-white p-8 rounded-3xl border-3 border-[#32302c] text-center relative shadow-[8px_8px_0px_#32302c] z-10 my-auto">
            <span className="font-mono text-xs uppercase tracking-widest text-[#e85a9c] font-bold block mb-1">
              PARTY PLAYLIST
            </span>
            <h2 className="font-playful text-4xl font-bold text-[#32302c] mb-2">
              Đĩa Nhạc Cổ Tích
            </h2>

            {/* Audio Source Badge */}
            <div className="mb-4 inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-[#fbcfe8] border-2 border-[#32302c] text-xs font-mono font-bold text-[#32302c] shadow-[2px_2px_0px_#32302c]">
              <Icon name="Music" className="w-3.5 h-3.5 text-[#32302c]" />
              <span>
                {isHttpAudio ? (audioError ? 'Synth Cổ Tích (Fallback)' : 'MP3 Trực Tuyến') : 'Synth Cổ Tích'}
              </span>
            </div>

            {/* Vinyl Record */}
            <div className="relative w-48 h-48 mx-auto mb-6">
              <div className={`w-full h-full rounded-full bg-[#32302c] border-4 border-[#fbcfe8] p-2 shadow-xl ${isPlaying ? 'animate-spin-slow' : ''}`}>
                <img
                  src={getDirectImageUrl(track.cover)}
                  alt={track.title}
                  className="w-full h-full object-cover rounded-full border-2 border-[#32302c]"
                />
              </div>
              <div className="absolute inset-0 m-auto w-10 h-10 rounded-full bg-[#fbcfe8] border-2 border-[#32302c] flex items-center justify-center text-xs font-bold text-[#32302c] shadow-md">
                ✨
              </div>
            </div>

            <h3 className="font-body font-bold text-xl text-[#32302c] mb-0.5">{track.title}</h3>
            <p className="font-mono text-xs font-bold text-[#e85a9c] mb-4">{track.artist}</p>

            <p className="font-caption italic text-xs text-[#32302c] mb-6 bg-[#fbcfe8]/40 p-3 rounded-xl border-2 border-[#32302c] font-medium">
              "{track.lyricsQuote}"
            </p>

            {/* Progress Bar for Direct Audio */}
            {isHttpAudio && duration > 0 && (
              <div className="mb-6 space-y-1">
                <input
                  type="range"
                  min="0"
                  max={duration || 100}
                  value={currentTime || 0}
                  onChange={(e) => {
                    const newTime = parseFloat(e.target.value);
                    if (audioRef.current) {
                      audioRef.current.currentTime = newTime;
                      setCurrentTime(newTime);
                    }
                  }}
                  className="w-full accent-[#f472b6] bg-[#fbcfe8] h-2 rounded-lg cursor-pointer border border-[#32302c]"
                />
                <div className="flex justify-between text-[10px] text-[#32302c] font-mono font-bold">
                  <span>{formatTime(currentTime)}</span>
                  <span>{formatTime(duration)}</span>
                </div>
              </div>
            )}

            <div className="flex items-center justify-center space-x-4 mb-6">
              <button
                onClick={togglePlay}
                className="w-14 h-14 rounded-2xl bg-[#f472b6] text-white border-3 border-[#32302c] shadow-[4px_4px_0px_#32302c] flex items-center justify-center hover:bg-[#db2777] active:translate-x-0.5 active:translate-y-0.5 transition-all"
              >
                <Icon name={isPlaying ? "Pause" : "Play"} className="w-7 h-7 fill-current" />

              <button

                title="Bài Tiếp Theo"

              </button>
            </div>

            <button
              onClick={onNext}
              className="pill-btn w-full justify-center text-sm shadow-md"
            >
              <span>Xem Album Kỷ Niệm 📸</span>
            </button>
          </div>
        </div>
      );
    }

                                  setEdited({

                                className="w-full px-2 py-1 rounded bg-purple-900/60 border border-pink-500/20 text-white font-bold"

                          <div>

    // --- MAIN APP ENTRY COMPONENT ---
    function App() {
      const [currentScene, setCurrentScene] = useState(0);
      const [hasGoldenKey, setHasGoldenKey] = useState(false);
      const [isEditorOpen, setIsEditorOpen] = useState(false);

      // Persistent Configuration in LocalStorage
      const [config, setConfig] = useState(() => {
        const saved = localStorage.getItem('royal_birthday_config');
        return saved ? JSON.parse(saved) : defaultBirthdayConfig;
      });

      const handleSaveConfig = (newConfig) => {
        setConfig(newConfig);
        localStorage.setItem('royal_birthday_config', JSON.stringify(newConfig));
      };

      const handleResetDefault = () => {
        if (confirm("Khôi phục toàn bộ cấu hình mặc định ban đầu?")) {
          setConfig(defaultBirthdayConfig);
          localStorage.removeItem('royal_birthday_config');
          setIsEditorOpen(false);
        }
      };

      const totalScenes = 9;

      return (
        <div className="min-h-screen relative overflow-hidden">
          {/* Ambient Particles */}
          <ParticleCanvas />

          {/* Top Header Navigation */}
          {currentScene > 0 && (
            <HeaderNav
              currentScene={currentScene}
              totalScenes={totalScenes}
              onSelectScene={(idx) => setCurrentScene(idx)}
              hasGoldenKey={hasGoldenKey}
              onOpenEditor={() => setIsEditorOpen(true)}
              config={config}
            />
          )}

          {/* Scene Render Switcher */}
          <main className="relative z-10 min-h-screen">
            {currentScene === 0 && (
              <LoadingScreen
                config={config}
                onComplete={() => setCurrentScene(1)}
              />
            )}

            {currentScene === 1 && (
              <CastleEntrance
                onNext={() => setCurrentScene(2)}
              />
            )}

            {currentScene === 2 && (
              <HeartQuestGame
                onCompleteKey={() => {
                  setHasGoldenKey(true);
                  setCurrentScene(3);
                }}
              />
            )}

            {currentScene === 3 && (
              <TreasureRoom
                hasGoldenKey={hasGoldenKey}
                onNext={() => setCurrentScene(4)}
              />
            )}

            {currentScene === 4 && (
              <TypewriterLetter
                config={config}
                onNext={() => setCurrentScene(5)}
              />
            )}

            {currentScene === 5 && (
              <MusicPlayer
                config={config}
                onNext={() => setCurrentScene(6)}
              />
            )}

            {currentScene === 6 && (
              <PolaroidGallery
                config={config}
                onNext={() => setCurrentScene(7)}
              />
            )}

            {currentScene === 7 && (
              <BirthdayCake
                config={config}
                onNext={() => setCurrentScene(8)}
              />
            )}

            {currentScene === 8 && (
              <WishWall
                config={config}
                onRestart={() => setCurrentScene(0)}
              />
            )}
          </main>

          {/* Modal Editor */}
          <ConfigEditorModal
            isOpen={isEditorOpen}
            onClose={() => setIsEditorOpen(false)}
            config={config}
            onSaveConfig={handleSaveConfig}
            onResetDefault={handleResetDefault}
          />
        </div>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
