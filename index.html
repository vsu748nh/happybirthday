    // --- WEB AUDIO SYNTHESIZER ENGINE ---
    class AudioSynthEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.timer = null;
        this.currentTrack = null;
      }

      initCtx() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playNote(freq, duration, type = 'sine', gainVal = 0.15) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }

      playTypewriterClick() {
        this.initCtx();
        this.playNote(800 + Math.random() * 200, 0.04, 'triangle', 0.05);
      }

      playMagicSparkle() {
        this.initCtx();
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.playNote(freq, 0.3, 'sine', 0.1);
          }, idx * 60);
        });
      }

      startMelody(presetName) {
        this.stop();
        this.initCtx();
        this.isPlaying = true;
        this.currentTrack = presetName;

        const melodies = {
          'synth-romantic-waltz': [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 329.63, 293.66],
          'synth-starlight-lullaby': [392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 523.25],
          'synth-princess-theme': [523.25, 659.25, 783.99, 880.00, 783.99, 659.25, 523.25]
        };

        const notes = melodies[presetName] || melodies['synth-romantic-waltz'];
        let step = 0;

        this.timer = setInterval(() => {
          if (!this.isPlaying) return;
          const note = notes[step % notes.length];
          this.playNote(note, 0.8, 'sine', 0.12);
          this.playNote(note * 0.5, 1.2, 'triangle', 0.05);
          step++;
        }, 600);
      }

      stop() {
        this.isPlaying = false;
        if (this.timer) {
          clearInterval(this.timer);
          this.timer = null;
        }
      }
    }

    const audioSynth = new AudioSynthEngine();

    // --- PARTICLE BACKGROUND CANVAS ---
    function ParticleCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = Array.from({ length: 45 }).map(() => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2.5 + 0.5,
          color: Math.random() > 0.4 ? '#FF80AB' : '#FFD700',
          vy: -(Math.random() * 0.5 + 0.2),
          vx: (Math.random() - 0.5) * 0.4,
          alpha: Math.random() * 0.8 + 0.2,
          pulse: Math.random() * 0.02 + 0.005
        }));

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          particles.forEach(p => {
            p.y += p.vy;
            p.x += p.vx;
            p.alpha += Math.sin(Date.now() * p.pulse) * 0.01;

            if (p.y < -10) {
              p.y = canvas.height + 10;
              p.x = Math.random() * canvas.width;
            }

            ctx.save();
            ctx.globalAlpha = Math.max(0.1, Math.min(1, p.alpha));
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', resizeCanvas);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 w-full h-full" />;
    }

    // --- SCENE 2: HEART QUEST GAME ---
    function HeartQuestGame({ onCompleteKey }) {
      const [foundHearts, setFoundHearts] = useState([]);
      const totalHearts = 5;

      const heartPositions = [
        { id: 1, top: '25%', left: '20%', hint: 'Bông hoa hồng kỳ diệu' },
        { id: 2, top: '35%', left: '75%', hint: 'Đỉnh tháp cổ kính' },

        { id: 4, top: '70%', left: '80%', hint: 'Khu vườn hoàng gia' },
        { id: 5, top: '50%', left: '50%', hint: 'Trái tim trung tâm' },
      ];

      const handleCollectHeart = (id) => {
        if (!foundHearts.includes(id)) {
          audioSynth.playMagicSparkle();
          const updated = [...foundHearts, id];
          setFoundHearts(updated);
        }
      };

      return (
        <div className="flex flex-col items-center justify-center min-h-screen px-4 pt-20 text-center relative">
          <div className="mb-6">

            {/* Hidden Hearts */}
            {heartPositions.map((h) => {
              const isFound = foundHearts.includes(h.id);
              return (
                <button
                  key={h.id}
                  onClick={() => handleCollectHeart(h.id)}
                  style={{ top: h.top, left: h.left }}
                  className={`absolute -translate-x-1/2 -translate-y-1/2 p-3 rounded-full transition-all duration-300 ${
                    isFound
                      ? 'bg-yellow-400 text-purple-950 scale-125 shadow-glow ring-4 ring-yellow-300'

                onClick={() => {
                  audioSynth.playMagicSparkle();
                  onCompleteKey();
                }}

    // --- SCENE 4: TYPEWRITER LETTER ---
    function TypewriterLetter({ onNext, config }) {
      const [textIndex, setTextIndex] = useState(0);
      const [isDone, setIsDone] = useState(false);

      const fullText = useMemo(() => config.letter.paragraphs.join("\n\n"), [config]);

      useEffect(() => {
        if (textIndex < fullText.length) {
          const timer = setTimeout(() => {
            setTextIndex(prev => prev + 1);
            if (textIndex % 3 === 0) {
              audioSynth.playTypewriterClick();
            }
          }, config.letter.typewriterSpeedMs || 35);
          return () => clearTimeout(timer);
        } else {
          setIsDone(true);
        }
      }, [textIndex, fullText, config]);

      return (
        <div className="flex flex-col items-center justify-center min-h-screen px-4 py-24">
          <div className="w-full max-w-2xl glass-card p-6 md:p-10 rounded-3xl border border-pink-500/30 relative shadow-2xl">

              {fullText.slice(0, textIndex)}
              {!isDone && <span className="animate-pulse text-yellow-400">|</span>}
            </div>

            {isDone && (
              <div className="mt-8 text-right space-y-1 font-handwritten text-xl text-yellow-300">

            )}

                onClick={onNext}

              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- SCENE 5: MUSIC PLAYER ---
    function MusicPlayer({ onNext, config }) {
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTrackIdx, setCurrentTrackIdx] = useState(0);

      const track = config.playlist[currentTrackIdx] || config.playlist[0];

      const togglePlay = () => {
        if (isPlaying) {
          audioSynth.stop();
          setIsPlaying(false);
        } else {
          audioSynth.startMelody(track.audioUrl);
          setIsPlaying(true);
        }
      };

      const handleNextTrack = () => {
        const nextIdx = (currentTrackIdx + 1) % config.playlist.length;
        setCurrentTrackIdx(nextIdx);
        if (isPlaying) {
          audioSynth.startMelody(config.playlist[nextIdx].audioUrl);
        }
      };

      return (
        <div className="flex flex-col items-center justify-center min-h-screen px-4 pt-20">
          <div className="w-full max-w-md glass-card p-8 rounded-3xl border border-pink-500/30 text-center relative">

                <img

                  className="w-full h-full object-cover rounded-full"
                />

            <h3 className="text-xl font-bold text-white mb-1">{track.title}</h3>
            <p className="text-sm text-pink-300 mb-6">{track.artist}</p>

            <div className="flex items-center justify-center space-x-6 mb-8">
              <button
                onClick={togglePlay}

              >
                <Icon name={isPlaying ? "Pause" : "Play"} className="w-8 h-8 fill-current" />
              </button>

              <button
                onClick={handleNextTrack}
                className="p-3 rounded-full bg-purple-950/60 text-pink-300 border border-pink-500/30 hover:bg-pink-500/20"
              >
                <Icon name="SkipForward" className="w-6 h-6" />

            </div>

            <button
              onClick={onNext}
              className="w-full py-3.5 rounded-full bg-gradient-to-r from-pink-500 to-yellow-400 text-purple-950 font-bold text-base shadow-lg hover:scale-105 transition-all"

            </button>
          </div>
        </div>
      );

            <div className="space-y-4 text-sm">
              <div>
                <label className="block text-xs font-semibold text-pink-300 mb-1">Tên Công Chúa / Người Nhận</label>
                <input
                  type="text"
                  value={edited.recipientName}
                  onChange={(e) => setEdited({ ...edited, recipientName: e.target.value })}
                  className="w-full px-4 py-2 rounded-xl bg-purple-950/80 border border-pink-500/30 text-white focus:outline-none focus:border-yellow-400"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-pink-300 mb-1">Tên Người Gửi</label>
                <input
                  type="text"
                  value={edited.senderName}
                  onChange={(e) => setEdited({ ...edited, senderName: e.target.value })}
                  className="w-full px-4 py-2 rounded-xl bg-purple-950/80 border border-pink-500/30 text-white focus:outline-none focus:border-yellow-400"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-pink-300 mb-1">Tiêu Đề Tuổi Mới</label>
                <input
                  type="text"
                  value={edited.ageTitle}
                  onChange={(e) => setEdited({ ...edited, ageTitle: e.target.value })}
                  className="w-full px-4 py-2 rounded-xl bg-purple-950/80 border border-pink-500/30 text-white focus:outline-none focus:border-yellow-400"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-pink-300 mb-1">Nội Dung Thư Tình</label>
                <textarea
                  rows={5}
                  value={edited.letter.paragraphs.join("\n\n")}
                  onChange={(e) => setEdited({
                    ...edited,
                    letter: { ...edited.letter, paragraphs: e.target.value.split("\n\n") }
                  })}
                  className="w-full px-4 py-2 rounded-xl bg-purple-950/80 border border-pink-500/30 text-white focus:outline-none focus:border-yellow-400"
                />
              </div>
            </div>

            <div className="flex items-center justify-end space-x-3 mt-6 pt-4 border-t border-pink-500/20">
              <button
                onClick={onResetDefault}
                className="px-4 py-2 rounded-xl bg-gray-800 text-gray-300 hover:bg-gray-700 text-xs font-bold"
              >
                Mặc Định
              </button>
              <button
                onClick={handleSave}
                className="px-6 py-2 rounded-xl bg-gradient-to-r from-pink-500 to-yellow-400 text-purple-950 font-bold text-sm shadow-lg hover:scale-105"
              >
                Lưu Thay Đổi
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentScene, setCurrentScene] = useState(0);
      const [hasGoldenKey, setHasGoldenKey] = useState(false);
      const [config, setConfig] = useState(defaultBirthdayConfig);
      const [isEditorOpen, setIsEditorOpen] = useState(false);

      const totalScenes = 9;

      const handleNextScene = () => {
        setCurrentScene((prev) => Math.min(totalScenes - 1, prev + 1));
      };

      const handleSelectScene = (sceneIdx) => {
        setCurrentScene(sceneIdx);
      };

      const handleUnlockKey = () => {
        setHasGoldenKey(true);
        handleNextScene();
      };

      return (
        <div className="min-h-screen relative font-sans select-none overflow-x-hidden">
          <ParticleCanvas />

          {currentScene > 0 && (
            <HeaderNav
              currentScene={currentScene}
              totalScenes={totalScenes}
              onSelectScene={handleSelectScene}
              hasGoldenKey={hasGoldenKey}
              onOpenEditor={() => setIsEditorOpen(true)}
            />
          )}

          <main className="relative z-10 min-h-screen">
            {currentScene === 0 && (
              <LoadingScreen onComplete={handleNextScene} config={config} />
            )}
            {currentScene === 1 && (
              <CastleEntrance onNext={handleNextScene} />
            )}
            {currentScene === 2 && (
              <HeartQuestGame onCompleteKey={handleUnlockKey} />
            )}
            {currentScene === 3 && (
              <TreasureRoom onNext={handleNextScene} hasGoldenKey={hasGoldenKey} />
            )}
            {currentScene === 4 && (
              <TypewriterLetter onNext={handleNextScene} config={config} />
            )}
            {currentScene === 5 && (
              <MusicPlayer onNext={handleNextScene} config={config} />
            )}
            {currentScene === 6 && (
              <PolaroidGallery onNext={handleNextScene} config={config} />
            )}
            {currentScene === 7 && (
              <BirthdayCake onNext={handleNextScene} config={config} />
            )}
            {currentScene === 8 && (
              <EmotionalEnding onRestart={() => setCurrentScene(0)} config={config} />
            )}
          </main>

          <ConfigEditorModal
            isOpen={isEditorOpen}
            onClose={() => setIsEditorOpen(false)}
            config={config}
            onSaveConfig={(newConfig) => setConfig(newConfig)}
            onResetDefault={() => setConfig(defaultBirthdayConfig)}
          />
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
